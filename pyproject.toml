[project]
name = "hookwatch"
version = "0.1.0"
description = "Webhook monitoring and management system with an MCP interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
